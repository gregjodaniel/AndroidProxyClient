name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.22.8
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.8"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        env:
          GOTOOLCHAIN: local
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240404192539-74d15d658dd2
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240404192539-74d15d658dd2
          gomobile init
          gomobile bind -target=android -androidapi 21 -ldflags="-s -w" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.0.1.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.0.1
          path: release_output/AndroidProxyClient-v1.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "Android Proxy Client v1.0.1 (Release)"
          body: |
            ## Android Proxy Client v1.0.1

            基于 **SingBox / Android VpnService** 的开源高性能 Android 代理客户端。

            ### 🚀 核心修复 (v1.0.1)
            - 🌟 **原生 SingBox 内核完整打包**：修复 `libcore.aar` 原生二进制打包依赖（从 `compileOnly` 切换为 `implementation`），修复 gomobile 绑定与 `sing-box/include` 协议注册。
            - 🌟 **Cloudflare CDN 优选节点专属适配**：WebSocket `Host` 握手头与路径解码注入。
            - 🌟 **VPN TUN 真实描述符对接**：修复内核启动与流量转发链路。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.0.1.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}