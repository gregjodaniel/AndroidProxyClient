name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          gomobile init
          export GOFLAGS="-ldflags=-checklinkname=0"
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 21 -ldflags="-s -w -checklinkname=0" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.0.6.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.0.6
          path: release_output/AndroidProxyClient-v1.0.6.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.6
          name: "Android Proxy Client v1.0.6 (Release - Robust Gomobile Reflection & Diagnostic)"
          body: |
            ## Android Proxy Client v1.0.6

            基于 **官方 SingBox v1.13.20 SFA (SingBox For Android) 平台架构** 的开源高性能 Android 代理客户端。

            ### 🚀 关键修复 (v1.0.6)
            - 🌟 **修复 Gomobile 反射方法签名匹配**：解决大小写敏感（`newEngine` vs `NewEngine`）导致的原生内核反射调用静默失败。
            - 🌟 **增加前台实时错误诊断弹窗**：启动遇到任何异常均会实时弹窗展示具体错误。
            - 🌟 **SingBox v1.13.20 最新生产内核**。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.0.6.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}