name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          gomobile init
          export GOFLAGS="-ldflags=-checklinkname=0"
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 21 -ldflags="-s -w -checklinkname=0" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.1.0.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.1.0
          path: release_output/AndroidProxyClient-v1.1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "Android Proxy Client v1.1.0 (Release - Official SFA SingBox v1.13.20 Architecture)"
          body: |
            ## Android Proxy Client v1.1.0

            基于 **官方 SingBox v1.13.20 SFA (SingBox For Android) 核心容器** 的开源高性能 Android 代理客户端。

            ### 🚀 终极完整修复 (v1.1.0)
            - 🌟 **官方 SFA 内核架构（CommandServer + PlatformBridge）**：SingBox 官方为 Android 定制的平台抽象容器，自动管理所有协议注册表。
            - 🌟 **智能大小写反射匹配（newEngine/NewEngine）**：彻底解决 gomobile JNI 导出方法名驼峰化导致的反射异常。
            - 🌟 **规范化 SingBox 路由规则（`final: <outbound>`）**：消除空路由规则校验失败。
            - 🌟 **完整支持 VLESS / VMess / Shadowsocks / Hysteria2 及 Cloudflare CDN 优选**。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.1.0.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}