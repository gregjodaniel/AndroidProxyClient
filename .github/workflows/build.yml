name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          go get github.com/xjasonlyu/tun2socks/v2@v2.7.0
          go mod tidy
          gomobile init
          export GOFLAGS="-ldflags=-checklinkname=0"
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 21 -ldflags="-s -w -checklinkname=0" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.2.7.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.2.7
          path: release_output/AndroidProxyClient-v1.2.7.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.7
          name: "Android Proxy Client v1.2.7 (Release - DNS Bootstrap Fix)"
          body: |
            ## Android Proxy Client v1.2.7

            基于 **SingBox v1.13.20 + gVisor Tun2Socks v2.7.0** 纯用户态架构的开源高性能 Android 代理客户端。

            ### 🚀 关键修复 (v1.2.7)
            - 🌟 **修复域名节点永远连不上**：v1.2.6 的 `local-dns` (type:local) 在 Android 上实际无效——sing-box 的 local 实现读 `/etc/resolv.conf`，而 Android 没有这个文件，会回退到 `127.0.0.1:53`，节点域名解析永远失败。现改为直连 UDP DNS (`223.5.5.5`) 做 bootstrap，并用精确的 `domain` 规则替代已废弃的 `outbound:any` 写法。
            - 🌟 **分流模式开关正式生效**：RULE=局域网直连+其余走代理，GLOBAL=全局代理，DIRECT=全局直连（新增 `direct` 出站）。
            - 🌟 **TUN FD 归属修复**：Go 侧 dup 一份 fd 给 gVisor，避免与 Kotlin 侧重复 close 同一个 fd。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.2.7.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.2.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}