name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          gomobile init
          gomobile bind -target=android -androidapi 21 -ldflags="-s -w" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.0.3.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.0.3
          path: release_output/AndroidProxyClient-v1.0.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: "Android Proxy Client v1.0.3 (Release)"
          body: |
            ## Android Proxy Client v1.0.3

            基于 **SingBox / Android VpnService** 的开源高性能 Android 代理客户端。

            ### 🚀 全面对齐成熟客户端体系（SFA / v2rayNG 标准）：
            - 🌟 **精准 DNS 劫持与分流**：添加 UDP 53 端口全局劫持规则，彻底解决 Android 应用 DNS 解析无响应问题。
            - 🌟 **TLS 协议扩展修复**：修复 ALPN 空数组传输导致 Cloudflare CDN 握手失败的问题。
            - 🌟 **gVisor 用户态网络栈**：TUN Inbound 指定 `"stack": "gvisor"`，完成原始 IP 报文与代理数据流无损互转。
            - 🌟 **Cloudflare CDN 优选节点专属适配**：WebSocket `Host` 握手头与路径解码注入。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.0.3.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}