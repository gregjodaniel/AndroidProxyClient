name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          go mod tidy
          gomobile init
          gomobile bind -target=android -androidapi 21 -ldflags="-s -w" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.0.2.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.0.2
          path: release_output/AndroidProxyClient-v1.0.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "Android Proxy Client v1.0.2 (Release)"
          body: |
            ## Android Proxy Client v1.0.2

            基于 **SingBox / Android VpnService** 的开源高性能 Android 代理客户端。

            ### 🚀 关键架构修复 (v1.0.2)
            - 🌟 **对接官方 libbox 平台保护接口**：将 `VpnService.protect(fd)` 完整接入 sing-box `AutoDetectInterfaceControl`，彻底解决出站流量被 VPN 自循环拦截导致的连接超时死锁问题。
            - 🌟 **启用 gVisor 用户态网络栈**：TUN inbound 配置启用 `"stack": "gvisor"`，实现 Android 原始 IP 数据包与代理 TCP/UDP 双向转发。
            - 🌟 **移除本地缺失的 geoip.db 规则依赖**：改用 IP CIDR 纯原生规则分流，防止内核启动报 `open geoip.db: no such file` 异常崩溃。
            - 🌟 **Cloudflare CDN 优选节点专属适配**：WebSocket `Host` 握手头与路径解码注入。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.0.2.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}