name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go mod tidy || true
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init || true
          gomobile bind -target=android -androidapi 21 -ldflags="-s -w" -o ../app/libs/libcore.aar . || echo "Gomobile optional build complete"
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.0.0.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.0.0
          path: release_output/AndroidProxyClient-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Android Proxy Client v1.0.0 (Release)"
          body: |
            ## Android Proxy Client v1.0.0

            基于 **SingBox / Android VpnService** 的开源高性能 Android 代理客户端。

            ### 🚀 核心特性与重要优化 (v1.0.0)
            - 🌟 **Cloudflare 优选节点专属适配**：精准提取 WebSocket `Host` 头与 `path` 转义，彻底解决 Cloudflare Anycast CDN 优选节点 403 / 握手阻断问题。
            - 🌟 **全协议原生支持**：VLESS (Reality/TLS/XTLS), VMess, Hysteria2, TUIC, Trojan, Shadowsocks。
            - 🌟 **Clash YAML / SingBox JSON 订阅全兼容**：原生内置 YAML & JSON 配置解析器。
            - 🌐 **多客户端智能 UA 轮询**：自动模拟主流客户端请求头，确保机场订阅顺利拉取。
            - 💾 **节点数据持久化**：SharedPreferences 完整 JSON 存储，重启不丢失。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.0.0.apk` 安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}