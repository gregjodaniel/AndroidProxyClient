name: Build and Release Android Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Go Core (libcore.aar)
        run: |
          mkdir -p app/libs
          cd core
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind@latest
          go get github.com/xjasonlyu/tun2socks/v2@v2.7.0
          go mod tidy
          gomobile init
          export GOFLAGS="-ldflags=-checklinkname=0"
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 21 -ldflags="-s -w -checklinkname=0" -o ../app/libs/libcore.aar .
          ls -lh ../app/libs/
          cd ..

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_output/AndroidProxyClient-v1.2.6.apk \;
          ls -la release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidProxyClient-v1.2.6
          path: release_output/AndroidProxyClient-v1.2.6.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.6
          name: "Android Proxy Client v1.2.6 (Release - Anti-Crash & DNS Circular Loop Fix)"
          body: |
            ## Android Proxy Client v1.2.6

            基于 **SingBox v1.13.20 + gVisor Tun2Socks v2.7.0** 纯用户态架构的开源高性能 Android 代理客户端。

            ### 🚀 终极关键修复 (v1.2.6)
            - 🌟 **彻底解决连接数秒后闪退问题**：解决 DNS 循环解析死锁与栈溢出崩溃。加入 `local-dns`（系统本地安全解析）并配置 `outbound: any -> local-dns`，代理节点域名不再自循环死锁！
            - 🌟 **Go 原生内核 Stderr 重定向与崩溃持久化记录**：新增 `initCrashLogger` 将底层致命错误定向到磁盘日志，启动时即时呈现完整调用栈。
            - 🌟 **TUN FD 非阻塞设置与安全关闭保护**：防止多重关闭与 Epoll 资源冲突。

            ### 📥 下载安装
            直接下载下方 Assets 中的 `AndroidProxyClient-v1.2.6.apk` 覆盖安装即可。
          draft: false
          prerelease: false
          files: release_output/AndroidProxyClient-v1.2.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}